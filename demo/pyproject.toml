[project]
name = "jupyter-ai-pi-demo"
version = "0.1.0"
description = "JupyterLite AI Demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.5.0",
    "jupyterlab-day>=0.2.0",
    "jupyterlab-night>=0.5.2",
    "jupyter-ai-pi",
    "jupyter-ai-pi-terminal",
    "jupyterlite-terminal>=1.6.2",
    "jupyterlite-core>=0.8.6",
    "jupyterlite-pyodide-kernel>=0.8.5",
]

[tool.uv.sources]
jupyter-ai-pi = { path = "../python/jupyter-ai-pi" }
jupyter-ai-pi-terminal = { path = "../python/jupyter-ai-pi-terminal" }
